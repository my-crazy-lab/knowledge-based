<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Basic Web Server</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Basic Web Server</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/login">Login</a>
            </nav>
        </header>

        <main>
            <div class="login-container">
                <div class="login-form">
                    <h2>Login</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Username:</label>
                            <input type="text" id="username" name="username" required>
                            <small>Use: admin</small>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="password" required>
                            <small>Use: password</small>
                        </div>
                        
                        <button type="submit">Login</button>
                    </form>
                    
                    <div id="loginMessage" class="message"></div>
                </div>

                <div class="info-box">
                    <h3>Demo Credentials</h3>
                    <p><strong>Username:</strong> admin</p>
                    <p><strong>Password:</strong> password</p>
                    
                    <h3>Features</h3>
                    <ul>
                        <li>Session-based authentication</li>
                        <li>Secure cookie handling</li>
                        <li>Automatic session expiration</li>
                        <li>Protected route access</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('loginMessage');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    messageDiv.innerHTML = '<div class="success">Login successful! Redirecting...</div>';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    messageDiv.innerHTML = `<div class="error">${result.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">Network error occurred</div>';
            }
        });
    </script>
</body>
</html>
